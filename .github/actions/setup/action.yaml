name: Setup
description: Set up Node.js and restore or install dependencies from a shared cache

inputs:
  prepare:
    description: Run nuxt prepare so .nuxt exists for eslint, typecheck and tests
    required: false
    default: "true"
  save-cache:
    description: Save the installed dependencies to the cache, enable on exactly one job per workflow
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"

    - name: Restore dependencies
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Save dependencies
      if: inputs.save-cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: node_modules
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Prepare Nuxt
      if: inputs.prepare == 'true' && steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm nuxt prepare